<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Family Finance Planner - household budgets, bills, loans, insurance, diary and analytics, synced live to every device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family Planner">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Family Finance Planner</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="same-origin">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- Painted before the bundle downloads, so a cold start shows the brand instead
       of an empty page. app.js replaces it on its first render. -->
  <div id="boot" role="status" aria-live="polite">
    <div class="bootcard">
      <div class="bootlogo">₹</div>
      <h1>Family Finance Planner</h1>
      <div class="bootline"></div>
    </div>
  </div>
  <style>
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#0f172a;color:#fff;z-index:50;font:600 16px/1.4 system-ui,sans-serif}
    #boot .bootcard{text-align:center;display:grid;gap:10px;justify-items:center}
    #boot h1{font-size:18px;margin:0;font-weight:600}
    #boot .bootlogo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;color:#0f172a;background:#34d399}
    #boot .bootline{width:120px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#34d399,transparent);background-size:120px 3px;animation:bootslide 1.1s linear infinite}
    @keyframes bootslide{from{background-position:-120px 0}to{background-position:120px 0}}
    @media (prefers-reduced-motion:reduce){#boot .bootline{animation:none}}
  </style>
  <div id="app"></div>
  <div id="modal"></div>
  <noscript>This planner needs JavaScript to run.</noscript>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
