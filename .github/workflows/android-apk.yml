name: android-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build (web + worker bundle)
        run: npm run build

      # The Worker must start and be tested inside one step: a background process
      # does not reliably survive between GitHub Actions steps.
      - name: Worker + full local suite
        run: |
          set -euo pipefail
          # The snapshot route is a 404 unless a migration is enabled; the suite
          # validates its output, so this job turns it on.
          npx wrangler dev --port 8787 --local --log-level warn --var MIGRATION_MODE:1 > wrangler.log 2>&1 &
          WPID=$!
          trap 'kill "$WPID" 2>/dev/null || true' EXIT

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then
              echo "worker ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health > /dev/null || { echo "worker did not start"; cat wrangler.log; exit 1; }

          FFP_PIN=135790 node scripts/smoke.mjs

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Dependency audit (high and critical only)
        run: npm audit --audit-level=high

      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The runner image ships the Android SDK, but not the release keystore. This
  # job reports whether signing is configured so the signed build is skipped
  # (never silently debug-signed) until the secrets exist.
  signing-ready:
    name: signing-ready
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
             && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Signing configured: the signed release APK will be built." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signed release skipped: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. See android/SIGNING.md." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-apk:
    name: build-apk
    needs: [signing-ready, test, security]
    if: needs.signing-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # The SDK ships with ubuntu-latest; setup-android@v3 rejects its bundled
      # cmdline-tools, so use sdkmanager directly.
      - name: Install SDK platform and build-tools
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          test -x "$SDKM" || { echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; ls "$ANDROID_HOME"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore into runner temp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing; the release build cannot be signed." >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "keystore decoded into runner.temp"

      - name: Assemble release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature and manifest
        id: verify
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          VERSION_NAME="$(grep -E '^versionName=' android/gradle.properties | cut -d= -f2)"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          APK="family-planner-${VERSION_NAME}-${SHORT_SHA}.apk"

          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | head -5

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload staging artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-staging
          path: ${{ steps.verify.outputs.apk }}
          retention-days: 1
          if-no-files-found: error

      - name: Delete decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  build-debug:
    name: build-debug
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform and build-tools
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          test -x "$SDKM" || { echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; ls "$ANDROID_HOME"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0"

      # Installable test build. Signed with the throwaway debug key, so it can be
      # sideloaded but never published; the signed release comes from build-apk.
      - name: Assemble debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename
        id: name
        run: |
          VERSION_NAME="$(grep -E '^versionName=' android/gradle.properties | cut -d= -f2)"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          APK="family-planner-${VERSION_NAME}-${SHORT_SHA}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: family-planner-apk-debug
          path: ${{ steps.name.outputs.apk }}
          retention-days: 14
          if-no-files-found: error

  upload:
    name: upload
    needs: [signing-ready, build-apk]
    if: needs.signing-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-staging
          path: dist

      - name: Checksum
        id: checksum
        run: |
          set -euo pipefail
          APK="$(find dist -name '*.apk' | head -1)"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          {
            echo "### Android APK"
            echo ""
            echo "- file: \`$(basename "$APK")\`"
            echo "- sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: family-planner-apk
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: family-planner-apk
          path: dist

      - name: Attach APK to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Every push to main publishes the debug APK, because that is the build that is
  # installable without any repository secrets. When the signing secrets exist the
  # signed release is attached to the same release as well.
  release-push:
    name: release-push
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-debug.result == 'success'
    needs: [build-debug, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: family-planner-apk
          path: dist
        continue-on-error: true

      - name: Download debug APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: family-planner-apk-debug
          path: dist
        continue-on-error: true

      - name: Create release with both APKs
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Family Planner APK build ${{ github.run_number }}
          body: |
            Automated build from ${{ github.sha }}
            - Signed release APK (if available)
            - Debug APK
          draft: false
          prerelease: false
          files: |
            dist/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
